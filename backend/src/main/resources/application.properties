spring.application.name=FraudDetection

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fraud_detection}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
jwt.secret=${JWT_SECRET:change-this-development-secret-change-this-development-secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origin=http://localhost:5173
